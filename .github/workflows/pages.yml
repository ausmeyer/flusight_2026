name: Publish dashboard
run-name: Publish dashboard ${{ inputs.dashboard_commit }}

on:
  workflow_dispatch:
    inputs:
      dashboard_commit:
        description: Commit of the reviewed dashboard created by mighte publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dashboard_commit }}
          path: reviewed
          persist-credentials: false
      - name: Verify and stage the reviewed report
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('reviewed')
          assert {p.name for p in source.iterdir()} == {'.git', '.nojekyll', 'index.html', 'publication.json'}
          metadata = json.loads((source / 'publication.json').read_text())
          assert metadata['generator'] == 'mighte-pages-v1'
          assert hashlib.sha256((source / 'index.html').read_bytes()).hexdigest() == metadata['report_sha256']
          destination = pathlib.Path('_site')
          destination.mkdir()
          for name in ['index.html', 'publication.json', '.nojekyll']:
              assert not (source / name).is_symlink()
              shutil.copyfile(source / name, destination / name)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
